services:
  redis:
    image: redis:7-alpine
    container_name: connexmonitor-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - connex_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  connex_redis:
